spring.application.name=demo
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/exchangedb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security
app.security.username=admin
app.security.password=admin123

# APILayer
apilayer.base-url=https://api.apilayer.com/exchangerates_data
apilayer.api-key=wguGQfewsoHx2nBJBP6viBN58bLYTZWZ

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Info
info.app.name=${spring.application.name}
info.app.version=0.0.1-SNAPSHOT
info.app.description=Demo Microservice

# Logging
logging.level.com.example.demo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
